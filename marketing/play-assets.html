<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>WordPop! Play Store assets</title>
<style>
  /* Google Play listing art. Rendered by build-play-assets.sh at exact sizes;
     ?f=icon|feature selects the layout. Palette mirrors styles.css. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "Baloo 2", "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif;
    background: linear-gradient(160deg, #7b5cff, #4dc9ff);
    display: flex; align-items: center; justify-content: center;
    color: #fff; text-align: center; position: relative;
  }
  body::before, body::after {
    content: ""; position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.26), transparent 70%);
  }
  body::before { width: 62%; padding-bottom: 62%; top: -20%; left: -14%; }
  body::after  { width: 56%; padding-bottom: 56%; bottom: -24%; right: -16%; }
  .wrap { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; }
  .tile {
    background: #ffd23f; color: #5a3d00; font-weight: 800;
    border-radius: .2em; display: flex; align-items: center; justify-content: center;
    text-transform: uppercase;
  }
  .tiles { display: flex; }

  /* ---- icon 512x512: opaque, no transparency (Play applies its own mask) ---- */
  body.icon .wrap { flex-direction: column; gap: 0; }
  body.icon .pic { font-size: 232px; line-height: 1; filter: drop-shadow(0 8px 10px rgba(0,0,0,.28)); }
  body.icon .tiles { gap: 12px; margin-top: 26px; }
  body.icon .tile { width: 104px; height: 118px; font-size: 74px; box-shadow: 0 10px 0 #e0a800; }

  /* ---- feature graphic 1024x500: key art off-centre, Play overlays a play button ---- */
  body.feature .wrap { gap: 64px; padding: 0 70px; }
  body.feature .pic { font-size: 190px; line-height: 1; filter: drop-shadow(0 8px 10px rgba(0,0,0,.28)); }
  body.feature .title { font-size: 104px; font-weight: 800; line-height: .95; text-shadow: 0 4px 0 rgba(0,0,0,.18); }
  body.feature .tagline { font-size: 30px; font-weight: 700; margin-top: 12px; }
  body.feature .tiles { gap: 12px; margin-top: 26px; }
  body.feature .tile { width: 74px; height: 84px; font-size: 52px; box-shadow: 0 8px 0 #e0a800; }
</style>
</head>
<body>
  <div class="wrap" id="wrap"></div>
<script>
  const f = new URLSearchParams(location.search).get("f") || "icon";
  document.body.className = f;
  const TILES = ls => `<div class="tiles">${ls.map(l=>`<div class="tile">${l}</div>`).join("")}</div>`;
  const wrap = document.getElementById("wrap");
  if (f === "icon") {
    wrap.innerHTML = `<div class="pic">🐱</div>${TILES(["c","a","t"])}`;
  } else {
    // Left-weighted so Play's centre play-button overlay misses the wordmark.
    wrap.innerHTML = `<div class="pic">🐱</div>
      <div><div class="title">WordPop!</div>
      <div class="tagline">See the picture. Spell the word.</div>${TILES(["t","a","c"])}</div>`;
  }
</script>
</body>
</html>
